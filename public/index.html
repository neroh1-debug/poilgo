<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#224b99">
  <title>성취평가와 추정분할의 이해</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- 참여자 화면 -->
  <div id="aud" class="aud hidden">
    <div class="aud-top">
      <div class="ttl2">성취평가와 추정분할의 이해</div>
      <div class="st" id="conn">연결 중</div>
      <button class="lock" id="lockBtn" aria-label="발표자 모드">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
    </div>
    <div id="audStageSlot"></div>
    <div class="aud-pg" id="audPg"></div>
    <div id="panel" class="panel idle"></div>
    <button class="fab" id="askBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>질문하기
    </button>
  </div>

  <!-- 공용 슬라이드 무대 -->
  <div class="stage" id="stage"><div class="deck" id="deck"></div><div id="spot"></div></div>

  <!-- 발표자 도구 -->
  <div id="pres" class="hidden">
    <div class="qr-card" id="qrCard" title="클릭: 크게 보기 / Q: 접기">
      <img src="/qr.svg" alt="참여 QR">
      <div class="cap">QR로 참여 · 질문하기</div>
    </div>
    <button class="qbtn" id="qBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      질문 확인 <span class="badge zero" id="qBadge">0</span>
    </button>
    <div class="toolbar" id="toolbar">
      <button id="prevBtn" title="이전 (←)">◀</button>
      <span class="pg" id="pg">1 / 40</span>
      <button id="nextBtn" title="다음 (→)">▶</button>
      <span class="sep"></span>
      <button id="resetBtn" class="hidden" title="이 화면의 응답 초기화">응답 초기화</button>
      <button id="replayBtn" title="애니메이션 다시 재생 (R)">↻ 재생</button>
      <button id="qrBigBtn" title="QR 크게 (Q 길게)">QR 크게</button>
      <button id="fsBtn" title="전체화면 (F)">전체화면</button>
      <span class="sep"></span>
      <span class="ppl" id="ppl">접속 0</span>
      <button id="exitBtn" title="발표자 모드 종료">나가기</button>
    </div>
    <aside class="drawer" id="drawer">
      <header><h3>참여자 질문</h3><button id="drawerClose" aria-label="닫기">✕</button></header>
      <div class="filters"><button class="on" data-f="open">미답변</button><button data-f="all">전체</button></div>
      <div class="qlist" id="qlist"></div>
    </aside>
  </div>

  <div id="modalRoot"></div>

  <script src="/slides.js"></script>
  <script src="/app.js"></script>
</body>
</html>
